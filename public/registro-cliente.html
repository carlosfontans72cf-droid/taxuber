<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxuber - Registro de Cliente</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="theme-color" content="#FFD700">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 28px 22px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display:block; margin-bottom:6px; font-weight:500; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Crear cuenta de cliente</h2>
    <div class="form-group"><label>Nombre</label><input type="text" id="nombre" class="form-control"></div>
    <div class="form-group"><label>Apellido</label><input type="text" id="apellido" class="form-control"></div>
    <div class="form-group"><label>Email</label><input type="email" id="email" class="form-control"></div>
    <div class="form-group"><label>Contraseña</label><input type="password" id="password" class="form-control"></div>
    <div id="reg-error" style="color:var(--danger); min-height:20px; text-align:center;"></div>
    <button id="btn-register" class="btn btn-primary btn-block">Crear cuenta</button>
    <p style="text-align:center; margin-top:14px;">¿Ya tenés cuenta? <a href="/">Iniciar sesión</a></p>
  </div>

  <script type="module" src="/js/register-client.js"></script>
</body>
</html>
