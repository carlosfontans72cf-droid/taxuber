<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxuber - Iniciar Sesión</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="theme-color" content="#FFD700">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="logo">🚖</div>
      <h2>Taxuber</h2>
      <p style="text-align:center; color:#666; margin-bottom:20px;">
        Sistema de gestión de taxis
      </p>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" class="form-control" placeholder="Tu apellido" autocomplete="off">
      </div>

      <div class="form-group" style="position: relative;">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Contraseña" style="padding-right:42px;">
        <button type="button" class="ver-contrasena" data-target="password">👁</button>
      </div>

      <div id="login-error" style="color: var(--danger); text-align:center; margin-bottom:10px; min-height:20px;"></div>

      <button id="btn-login" class="btn btn-primary btn-block">
        Iniciar Sesión
      </button>

      <p style="text-align:center; margin-top:15px; color:#888; font-size:0.85rem;">
        Ingresa con tu usuario asignado
      </p>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
