<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxuber - Mi Panel</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/styles.css">
  <meta name="theme-color" content="#FFD700">
</head>
<body>

  <nav class="navbar">
    <h1>🧑 Mi Panel</h1>
    <span class="user-info" id="client-name">Cargando...</span>
    <button class="btn btn-sm" onclick="logout()">Salir</button>
  </nav>

  <div class="dashboard">

    <h3 class="section-title">Pedir un Traslado</h3>
    <div class="card">
      <div class="form-group"><label>Origen</label><input type="text" id="trip-origen" class="form-control" placeholder="Dirección de origen"></div>
      <div class="form-group"><label>Destino</label><input type="text" id="trip-destino" class="form-control" placeholder="Dirección de destino"></div>
      <div class="form-group"><label>N° Personas</label><input type="number" id="trip-personas" class="form-control" value="1" min="1"></div>
      <div class="btn-group">
        <button class="btn btn-info" onclick="calculateCost()">Calcular Costo</button>
      </div>

      <div class="trip-result" id="trip-result" style="display:none;">
        <div class="cost" id="trip-cost-display">$0</div>
        <div class="detail" id="trip-distance-display"></div>
        <div class="detail" id="trip-duration-display"></div>
      </div>

      <div class="btn-group" style="margin-top:15px">
        <button class="btn btn-success" onclick="requestTrip()">Pedir Traslado</button>
      </div>
    </div>

    <h3 class="section-title">Mis Viajes</h3>
    <div class="card">
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Ruta</th><th>Costo</th><th>Estado</th><th>Fecha</th></tr></thead>
          <tbody id="my-trips"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="/js/client.js"></script>
</body>
</html>
