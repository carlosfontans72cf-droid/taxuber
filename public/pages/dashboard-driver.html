<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxuber - Panel Chofer</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <meta name="theme-color" content="#28A745">
  <style>
    #driver-map { height: 350px; width: 100%; border-radius: 8px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <h1>🚖 Panel Chofer</h1>
    <span class="user-info" id="driver-name">Cargando...</span>
    <button class="btn btn-sm" onclick="logout()">Salir</button>
  </nav>

  <div class="dashboard">

    <h3 class="section-title">Nuevo Viaje</h3>
    <div class="card">
      <div class="form-group"><label>Origen</label><input type="text" id="trip-origen" class="form-control" placeholder="Dirección de origen"></div>
      <div class="form-group"><label>Destino</label><input type="text" id="trip-destino" class="form-control" placeholder="Dirección de destino"></div>
      <div class="form-group"><label>Calcular por</label>
        <select id="trip-modo" class="form-control">
          <option value="km">Kilómetros</option>
          <option value="hora">Hora</option>
          <option value="zona">Zona (tarifa fija)</option>
        </select>
      </div>
      <div class="form-group"><label>N° Personas</label><input type="number" id="trip-personas" class="form-control" value="1" min="1"></div>
      <div class="btn-group">
        <button class="btn btn-info" onclick="calculateCost()">Calcular Costo</button>
      </div>

      <div class="trip-result" id="trip-result" style="display:none;">
        <div class="cost" id="trip-cost-display">$0</div>
        <div class="detail" id="trip-distance-display"></div>
        <div class="detail" id="trip-duration-display"></div>
      </div>

      <div class="btn-group" style="margin-top:15px">
        <button class="btn btn-success" onclick="startTrip()">Iniciar Viaje</button>
        <button class="btn btn-danger" onclick="endTrip()">Finalizar Viaje</button>
      </div>
    </div>

    <h3 class="section-title">Mi Ubicación</h3>
    <div class="card"><div id="driver-map"></div></div>

    <h3 class="section-title">Alertas</h3>
    <div class="card">
      <div class="form-group">
        <textarea id="alert-descripcion" class="form-control" rows="2" placeholder="Describe el detalle..."></textarea>
      </div>
      <div class="btn-group">
        <button class="btn btn-danger" onclick="sendAlert('Robo')">Robo</button>
        <button class="btn btn-warning" onclick="sendAlert('Falta Combustible')">Combustible</button>
        <button class="btn btn-danger" onclick="sendAlert('Desperfecto')">Desperfecto</button>
        <button class="btn btn-warning" onclick="sendAlert('Ruta Cortada')">Ruta Cortada</button>
      </div>
    </div>

  </div>

  <div class="panic-container">
    <div class="panic-dropdown" id="panic-dropdown">
      <button class="alert-btn" onclick="sendAlert('Robo')">Robo</button>
      <button class="alert-btn" onclick="sendAlert('Falta Combustible')">Combustible</button>
      <button class="alert-btn" onclick="sendAlert('Desperfecto')">Desperfecto</button>
      <button class="alert-btn" onclick="sendAlert('Ruta Cortada')">Ruta Cortada</button>
    </div>
    <button class="panic-btn" id="panic-btn">️</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/driver.js"></script>
</body>
</html>
